<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Guru</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
</head>
<body>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  const user = LMS_AUTH.requireRole(["guru"]);
</script>

<script type="module">
</script>

<div id="root"></div>

<script>
const root = lmsRenderShell({ activeId: "dashboard-guru", title: "Dashboard Guru" });

root.innerHTML = `
  <div class="breadcrumb">Beranda &nbsp;›&nbsp; <b>Dashboard Guru</b> &nbsp;›&nbsp; Tinjauan Akademik</div>
  <div class="page-head">
    <div class="title">
      <h1 class="text-headline-lg">Ringkasan Aktivitas Guru</h1>
    </div>
    <div class="head-actions">
      <a class="btn primary" href="kursus-topik.html">+ Tambah Materi</a>
      <a class="btn" href="bank-soal.html">Buat Tugas Baru</a>
      <a class="btn" href="bank-soal.html">Rancang Kuis</a>
      <a class="btn" href="buku-nilai.html">Rekap Nilai</a>
    </div>
  </div>

  <div class="grid grid-4" id="stat-tiles" style="margin-bottom:16px"></div>

  <div class="grid" style="grid-template-columns:2fr 1fr;gap:16px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="text-label-sm text-muted">KURIKULUM FASE D</div>
        <h2 class="text-headline-sm" style="margin:4px 0 12px">Progres Pembelajaran per Topik</h2>
        <div id="topic-progress" style="display:flex;flex-direction:column;gap:16px"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h2 class="text-headline-sm">Pendampingan Khusus</h2>
          <span class="chip warn" id="remedial-count">0 Perlu Tinjauan</span>
        </div>
        <p class="text-body-sm text-muted" style="margin-bottom:10px">Siswa dengan keterlambatan tugas berturut-turut atau nilai kuis di bawah KKM.</p>
        <div id="remedial-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>
  </div>
`;

const statMeta = [
  { key: "tugasPerluDinilai", label: "Tugas Perlu Dinilai", suffix: "berkas", ic: "📋", cls: "mint" },
  { key: "tenggatMendekat", label: "Tenggat Mendekat", suffix: "evaluasi", ic: "🗓", cls: "warn" },
  { key: "rataNilaiKelas", label: "Rata-rata Nilai Kelas", suffix: "/ 100", ic: "📈", cls: "mint" },
  { key: "siswaAktif", label: "Siswa Aktif", suffix: "siswa", ic: "🎓", cls: "mint" },
];

function renderStatTiles(stats) {
  document.getElementById("stat-tiles").innerHTML = statMeta.map(m => `
    <div class="card stat-tile">
      <div class="top">
        <div>
          <div class="text-metric">${stats[m.key] ?? "–"}</div>
          <div class="label">${m.suffix} · ${m.label}</div>
        </div>
        <div class="ic ${m.cls}">${m.ic}</div>
      </div>
    </div>
  `).join("");
}

function renderTopicProgress(topics) {
  document.getElementById("topic-progress").innerHTML = topics.map(t => `
    <div>
      <div style="display:flex;justify-content:space-between;gap:8px">
        <div class="text-label-lg">${t.nama}</div>
        <div class="text-label-lg">${t.persen}%</div>
      </div>
      <div class="progress ${t.persen < 50 ? "warn" : ""}" style="margin:6px 0">
        <span style="width:${t.persen}%"></span>
      </div>
      <div class="text-body-sm text-muted">${t.modulSelesai}/${t.totalModul} modul selesai · ${t.catatan}</div>
    </div>
  `).join("") || `<div class="empty">Belum ada data topik. Tambahkan materi di menu Kursus &amp; Topik.</div>`;
}

function renderRemedial(list) {
  document.getElementById("remedial-count").textContent = `${list.length} Perlu Tinjauan`;
  document.getElementById("remedial-list").innerHTML = list.map(s => `
    <div class="card tight" style="display:flex;gap:10px;align-items:flex-start">
      <div class="avatar-sm">${lmsInitials(s.nama)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <div class="text-label-lg">${s.nama}</div>
          <span class="chip warn">${s.aksi}</span>
        </div>
        <div class="text-body-sm text-muted">${s.kelas} · ${s.catatan}</div>
      </div>
    </div>
  `).join("") || `<div class="empty">Tidak ada siswa yang butuh pendampingan saat ini 🎉</div>`;
}

async function load() {
  root.querySelector("#stat-tiles").innerHTML = Array(4).fill('<div class="card skeleton" style="height:88px"></div>').join("");
  try {
    const data = await LMS_API.call("getDashboardGuru", {});
    renderStatTiles(data.stats);
    renderTopicProgress(data.topics);
    renderRemedial(data.remedial);
  } catch (err) {
    lmsToast(err.message, true);
    renderStatTiles({});
    renderTopicProgress([]);
    renderRemedial([]);
  }
}
load();
</script>
</body>
</html>
