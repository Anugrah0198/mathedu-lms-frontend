<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Guru</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  .topic-row{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
  .topic-row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
</style>
</head>
<body>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script>const user = LMS_AUTH.requireRole(["guru", "superadmin"]);</script>

<div id="root"></div>

<script>
const root = lmsRenderShell({ activeId: "dashboard-guru", title: "Dashboard Guru" });

root.innerHTML = `
  <div class="breadcrumb">Panel Guru &nbsp;›&nbsp; <b>Dashboard</b></div>
  <div class="page-head">
    <div class="title">
      <h1 class="text-headline-lg">Dashboard Guru — Kelas ${user.kelas || "-"}</h1>
      <p>Ringkasan progres belajar, tugas yang perlu dinilai, dan siswa yang butuh perhatian.</p>
    </div>
    <div class="head-actions">
      <a class="btn primary" href="kursus-topik.html">+ Tambah Bab Baru</a>
      <a class="btn" href="koreksi-penilaian.html">Koreksi Tugas Masuk</a>
      <a class="btn" href="buku-nilai.html">Buku Nilai</a>
    </div>
  </div>

  <div class="grid grid-4" style="margin-bottom:16px" id="stat-tiles"></div>

  <div class="grid" style="grid-template-columns:1.4fr 1fr;gap:16px;align-items:start">
    <div class="card">
      <h2 class="text-headline-sm" style="margin-bottom:10px">Progres Modul per Bab</h2>
      <div id="topic-list"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <h2 class="text-headline-sm" style="margin-bottom:10px">Siswa Perlu Perhatian</h2>
        <div id="remedial-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2 class="text-headline-sm" style="margin-bottom:10px">Aktivitas Siswa Terbaru</h2>
    <table class="dt">
      <thead><tr><th>Siswa</th><th>Aktivitas</th><th>Status</th><th>Waktu</th></tr></thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
`;

const statMeta = [
  { key: "tugasPerluDinilai", label: "Tugas Perlu Dinilai", ic: "📥" },
  { key: "tenggatMendekat", label: "Kuis Aktif Dipantau", ic: "⏱" },
  { key: "rataNilaiKelas", label: "Rata-rata Nilai Kelas", ic: "📈" },
  { key: "siswaAktif", label: "Siswa Aktif", ic: "🎓" }
];

function renderStats(s) {
  document.getElementById("stat-tiles").innerHTML = statMeta.map(m => `
    <div class="card stat-tile"><div class="top"><div><div class="text-metric">${s[m.key] ?? "–"}</div><div class="label">${m.label}</div></div><div class="ic mint">${m.ic}</div></div></div>
  `).join("");
}

function statusChip(status) {
  const map = { selesai: "chip done", dilihat: "chip active", "menunggu-penilaian": "chip warn", diulang: "chip warn" };
  return `<span class="${map[status] || 'chip'}">${status}</span>`;
}

function renderTopics(topics) {
  document.getElementById("topic-list").innerHTML = topics.map(t => `
    <div class="topic-row">
      <div class="top">
        <div>
          <div class="text-label-lg">${t.nama}</div>
          <div class="text-body-sm text-muted">${t.catatan}</div>
        </div>
        <div style="text-align:right">
          <div class="text-headline-sm">${t.persen}%</div>
          <div class="text-body-sm text-muted">${t.modulSelesai}/${t.totalModul} selesai</div>
        </div>
      </div>
      <div class="progress"><span style="width:${t.persen}%"></span></div>
    </div>
  `).join("") || `<div class="empty">Belum ada bab yang dibuat. Buka "Kursus & Topik" untuk mulai menyusun modul.</div>`;
}

function renderRemedial(list) {
  document.getElementById("remedial-list").innerHTML = list.map(r => `
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div class="text-label-lg">${r.nama}</div>
        <div class="text-body-sm text-muted">${r.catatan}</div>
      </div>
      <span class="chip warn">${r.aksi}</span>
    </div>
  `).join("") || `<div class="empty">Tidak ada siswa yang butuh perhatian khusus saat ini. 🎉</div>`;
}

function renderLog(logs) {
  document.getElementById("log-body").innerHTML = logs.map(l => `
    <tr>
      <td style="display:flex;gap:10px;align-items:center"><div class="avatar-sm">${lmsInitials(l.siswa)}</div>${l.siswa}</td>
      <td>${l.aktivitas}</td>
      <td>${statusChip(l.status)}</td>
      <td class="text-muted">${new Date(l.waktu).toLocaleString("id-ID")}</td>
    </tr>
  `).join("") || `<tr><td colspan="4"><div class="empty">Belum ada aktivitas siswa tercatat.</div></td></tr>`;
}

async function load() {
  document.getElementById("stat-tiles").innerHTML = Array(4).fill('<div class="card skeleton" style="height:88px"></div>').join("");
  document.getElementById("topic-list").innerHTML = `<div class="skeleton" style="height:120px"></div>`;
  try {
    const d = await LMS_API.call("getDashboardGuru", {});
    renderStats(d.stats);
    renderTopics(d.topics);
    renderRemedial(d.remedial);
    renderLog(d.logTerkini);
  } catch (err) {
    lmsToast(err.message, true);
    renderStats({}); renderTopics([]); renderRemedial([]); renderLog([]);
  }
}
load();
</script>
</body>
</html>
