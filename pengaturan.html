<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengaturan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
</head>
<body>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script>const user = LMS_AUTH.requireRole(null);</script>
<div id="root"></div>
<script>
const root = lmsRenderShell({ activeId: "pengaturan", title: "Pengaturan" });
root.innerHTML = `
  <div class="breadcrumb"><b>Pengaturan</b></div>
  <div class="page-head"><div class="title"><h1 class="text-headline-lg">Pengaturan Akun</h1>
  <p>Kelola profil dan preferensi tampilan.</p></div></div>
  <div class="card" style="max-width:480px">
    <div class="form-field"><label>Nama</label><input value="${user.name}" disabled></div>
    <div class="form-field"><label>Peran</label><input value="${user.role}" disabled></div>
    <button class="btn" id="toggle-theme">Ganti Tema Terang/Gelap</button>
  </div>
`;
document.getElementById("toggle-theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
});
</script>
</body>
</html>
